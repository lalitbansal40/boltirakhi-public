<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="Bolti Rakhi">
  <!--
    Mark plus words, for the header. The type is a serif because the site's
    headings already are — a logo in a different family reads as a logo
    borrowed from somewhere else.
  -->
  <g transform="translate(0,0)">
    <g fill="none" stroke="#b4322e" stroke-width="3" stroke-linecap="round">
      <path d="M2 40 C 12 40, 14 32, 22 32"/>
    </g>
    <g fill="#e8b64c">
      <g id="q"><ellipse cx="32" cy="18" rx="4.5" ry="8"/></g>
      <use href="#q" transform="rotate(45 32 32)"/>
      <use href="#q" transform="rotate(90 32 32)"/>
      <use href="#q" transform="rotate(135 32 32)"/>
      <use href="#q" transform="rotate(180 32 32)"/>
      <use href="#q" transform="rotate(225 32 32)"/>
      <use href="#q" transform="rotate(270 32 32)"/>
      <use href="#q" transform="rotate(315 32 32)"/>
    </g>
    <circle cx="32" cy="32" r="11" fill="#b4322e"/>
    <g stroke="#fdf6ee" stroke-width="2.6" stroke-linecap="round">
      <path d="M27 29 v6"/><path d="M32 26 v12"/><path d="M37 29 v6"/>
    </g>
  </g>

  <text x="74" y="42"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="700" fill="#b4322e"
        letter-spacing="-0.4">Bolti<tspan fill="#8c5a1f" dx="8">Rakhi</tspan></text>
</svg>
